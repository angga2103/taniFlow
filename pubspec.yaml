name: taniflow
description: "Sistem Manajemen Usaha Pengepul Hasil Pertanian dan Komoditas Sayuran"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1

  # Local Database (Drift / SQLite)
  drift: ^2.24.2
  sqlite3_flutter_libs: ^0.5.28
  path_provider: ^2.1.5
  path: ^1.9.1

  # Security & Authentication
  flutter_secure_storage: ^9.2.4
  local_auth: ^2.3.0
  crypto: ^3.0.6

  # Utilities, Date, UUID
  intl: ^0.20.2
  uuid: ^4.5.1

  # Documents & Reporting (PDF & Excel)
  pdf: ^3.11.1
  printing: ^5.13.2
  excel: ^4.0.6
  share_plus: ^10.1.4
  open_filex: ^4.6.0

  # Bluetooth Thermal Printer
  print_bluetooth_thermal: ^1.1.2
  esc_pos_utils_plus: ^2.0.4

  # Google Drive Backup & APIs
  google_sign_in: ^6.2.2
  googleapis: ^13.2.0
  http: ^1.3.0
  archive: ^3.6.1

  # UI, Calendar & Charts
  table_calendar: ^3.1.3
  fl_chart: ^0.70.2

  # Notifications
  flutter_local_notifications: ^18.0.1

  # Icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  drift_dev: ^2.24.2
  build_runner: ^2.4.15
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
